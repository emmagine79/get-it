<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Gentle Day app icon, light</title>
  <desc id="desc">A warm completion mark rising over a soft day block on a light rounded square.</desc>
  <defs>
    <linearGradient id="base" x1="156" y1="96" x2="868" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8ee"/>
      <stop offset="0.58" stop-color="#f6eadb"/>
      <stop offset="1" stop-color="#ead9c6"/>
    </linearGradient>
    <linearGradient id="tile" x1="236" y1="346" x2="788" y2="748" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c87b6b"/>
      <stop offset="1" stop-color="#af6253"/>
    </linearGradient>
    <linearGradient id="sun" x1="370" y1="210" x2="676" y2="578" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8dc89"/>
      <stop offset="1" stop-color="#d9af4f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#8d6754" flood-opacity="0.24"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.94 0 1 0 0 0.60 0 0 1 0 0.36 0 0 0 0.28 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="236" fill="url(#base)"/>
  <path d="M240 258c44-74 128-122 224-122h96c132 0 246 82 292 198" fill="none" stroke="#e1cdb7" stroke-width="20" stroke-linecap="round" opacity="0.72"/>

  <g filter="url(#shadow)">
    <rect x="210" y="388" width="604" height="364" rx="112" fill="url(#tile)"/>
    <path d="M210 510c70 46 151 70 244 70h116c88 0 172-24 244-70v132c0 61-49 110-110 110H320c-61 0-110-49-110-110V510Z" fill="#975345" opacity="0.28"/>
  </g>

  <g filter="url(#softGlow)">
    <path d="M358 420c22-82 86-140 154-140s132 58 154 140" fill="none" stroke="url(#sun)" stroke-width="54" stroke-linecap="round"/>
    <path d="M396 444l78 78 164-188" fill="none" stroke="#fff6df" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M306 774c56 42 125 64 206 64s150-22 206-64" fill="none" stroke="#ffe8cf" stroke-width="18" stroke-linecap="round" opacity="0.44"/>
  <circle cx="726" cy="286" r="18" fill="#d9af4f" opacity="0.85"/>
</svg>
