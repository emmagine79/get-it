<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Gentle Day app icon</title>
  <desc id="desc">A warm completion mark rising over a soft day block on a dark rounded square.</desc>
  <defs>
    <linearGradient id="base" x1="168" y1="104" x2="856" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a241e"/>
      <stop offset="0.55" stop-color="#181410"/>
      <stop offset="1" stop-color="#0f0c0a"/>
    </linearGradient>
    <linearGradient id="tile" x1="236" y1="346" x2="788" y2="748" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c98170"/>
      <stop offset="1" stop-color="#a95f51"/>
    </linearGradient>
    <linearGradient id="sun" x1="370" y1="210" x2="676" y2="578" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#e8c96f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95 0 1 0 0 0.68 0 0 1 0 0.45 0 0 0 0.35 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="236" fill="url(#base)"/>
  <path d="M240 258c44-74 128-122 224-122h96c132 0 246 82 292 198" fill="none" stroke="#3c332b" stroke-width="20" stroke-linecap="round" opacity="0.55"/>

  <g filter="url(#shadow)">
    <rect x="210" y="388" width="604" height="364" rx="112" fill="url(#tile)"/>
    <path d="M210 510c70 46 151 70 244 70h116c88 0 172-24 244-70v132c0 61-49 110-110 110H320c-61 0-110-49-110-110V510Z" fill="#965445" opacity="0.36"/>
  </g>

  <g filter="url(#softGlow)">
    <path d="M358 420c22-82 86-140 154-140s132 58 154 140" fill="none" stroke="url(#sun)" stroke-width="54" stroke-linecap="round"/>
    <path d="M396 444l78 78 164-188" fill="none" stroke="#fff3dc" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M306 774c56 42 125 64 206 64s150-22 206-64" fill="none" stroke="#f5dec2" stroke-width="18" stroke-linecap="round" opacity="0.38"/>
  <circle cx="726" cy="286" r="18" fill="#e8c96f" opacity="0.85"/>
</svg>
